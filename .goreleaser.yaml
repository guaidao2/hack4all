version: 2
project_name: hack4all

before:
  hooks:
    - go mod tidy

builds:
  - id: hack4all
    main: ./cmd/hack4all
    binary: hack4all
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version=v{{ .Version }}"

# A single self-contained binary: the knowledge base is embedded, so there is
# nothing else to ship alongside it.
archives:
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^content: add"

release:
  github:
    owner: guaidao2
    name: Hack4all
  name_template: "Hack4all v{{ .Version }}"
  header: |
    A bilingual technique guide for penetration testing, red teaming and bug
    bounty hunting.

    One self-contained binary, three front-ends over the same content:

    - **TUI** — run `hack4all`: a searchable list with the full technique beside it
    - **Web** — run `hack4all web`: the same library in a browser, with the red
      team coverage map drawn at `/map.html`
    - **CLI** — `hack4all -x "QUERY" --json`: for scripts and AI agents

    60 techniques across 26 categories, including a beginner track that starts
    from the file format and the protocol, written in English and Chinese in the
    same file, every entry with a detection and a mitigation section. No emoji.

    The binaries are static (`CGO_ENABLED=0`) and the knowledge base is embedded,
    so there is nothing to install alongside them. Check a download against
    `hack4all_{{ .Version }}_checksums.txt`.
